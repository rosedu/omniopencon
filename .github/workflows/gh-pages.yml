name: GitHub Pages

on:
  push:
    branches:
      - main  # Set a branch to deploy
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.133.0'
          # extended: true

      - name: Build 2026 edition (current)
        run: hugo --minify --baseURL https://omniopencon.org/2026/ --destination public/2026

      - name: Build 2024 edition
        run: |
          git checkout 2024 -- config.yml static themes
          hugo --minify --baseURL https://omniopencon.org/2024/ --destination public/2024
          git checkout HEAD -- config.yml static themes

      - name: Build 2025 edition
        run: |
          git checkout 2025 -- config.yml static themes
          hugo --minify --baseURL https://omniopencon.org/2025/ --destination public/2025
          git checkout HEAD -- config.yml static themes

      - name: Create root redirect to 2026
        run: |
          cp static/CNAME public/CNAME
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>OmniOpenCon</title>
            <meta http-equiv="refresh" content="0; url=/2026/">
            <link rel="canonical" href="/2026/">
          </head>
          <body>
            <p>Redirecting to <a href="/2026/">OmniOpenCon 2026</a>…</p>
          </body>
          </html>
          EOF

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
