# OmniOpenCon 2026 — third edition.
# Schema is documented in README.md. Use TODO for anything not yet known.

year: 2026
ordinal: 3rd
title: OmniOpenCon 2026
tagline: A free gathering of people, projects and communities working with open source, open data, open science, open hardware and open education.
dates:
  start: "2026-10-16"
  end: "2026-10-17"
  display: October 16–17, 2026
venue:
  name: Central Library, POLITEHNICA Bucharest
  address: Splaiul Independenței 313, Bucharest, Romania
  map_query: Biblioteca Centrală UNSTPB, Splaiul Independenței 313, București
  notes: >-
    The Central Library is on the POLITEHNICA Bucharest campus, next to the Rectorate building.
    It is a short walk from the Politehnica metro station (M3) and from the Grozăvești metro station (M1).
    WiFi is available throughout the venue.

registration:
  label: Register for free
  url: https://luma.com/hi08i10q
  note: Attendance is free, but please register so we know how many people to expect.

cfs:
  url: https://sessionize.com/omniopencon-2026
  deadline: "2026-09-07"
  deadline_display: Monday, September 7, 2026
  # Set to true/false to force the call for speakers open or closed regardless of the deadline.
  # open: true
  text: >-
    We welcome speakers from all places and organizations to share their knowledge, insights and results in
    open source, open data, open education, open hardware, open governance, open science and all things open.
    Propose a **20-minute talk** or a **100-minute hands-on workshop**.

format:
  - title: Day 1 · Workshops
    when: Friday, October 16
    text: >-
      Hands-on workshops of 100 minutes, in small groups of up to 30 participants. Learn a tool, dive into a
      project, or build something together. Bring your laptop.
  - title: Day 2 · Talks
    when: Saturday, October 17
    text: >-
      A full day of 20-minute talks, plus questions, delivered in English. Communities, maintainers and
      researchers share what they are working on and why openness matters.

schedule:
  # The detailed schedule goes under `days` (see data/editions/2024.yaml for the format).
  # While it is not available, `note` is shown instead.
  note: >-
    The detailed schedule of workshops and talks is being finalized and will be published here.
    Join our Discord or check back soon.
  days:
    - label: Friday & Saturday
      date: "2026-10-16"
      theme: Workshops & Talks
      intro: >-
        Workshops on Friday, talks on Saturday. The full schedule of sessions, speakers and rooms is embedded below from Sessionize.
        Workshop seats are limited — register for each one individually via its Luma link below.
      embed: https://sessionize.com/api/v2/zjsm1kqn/view/GridSmart
      # Matched against the Sessionize session titles below by exact text (case-insensitive) to
      # add a "Register" link on the matching workshop card. Unmatched entries are silently skipped.
      registrations:
        - title: "Architecture in the Open: A Hands-On RFC and ADR Workshop"
          url: https://luma.com/84qz779y
        - title: "How to set-up your coding harness for AI native development"
          url: https://luma.com/8x8oli89
        - title: "Build and publish a static website visually, with free software"
          url: https://luma.com/1zr1rp04
        - title: "Iroh on esp32"
          url: https://luma.com/b0q3zifq
        - title: "Unikraft: a Fast, Secure and Open-Source Unikernel Development Kit"
          url: https://luma.com/x64ejdqv
        - title: "Whodunnit - Threat Hunting with Dissect and Volatility"
          url: https://luma.com/95eiqqtf
        - title: "Hands-on dive into Nix, Nixpkgs, and NixOS"
          url: https://luma.com/5wtwfw06
        - title: "Zephyr Meetup"
          url: https://luma.com/ii4gm9at
        - title: "Digital Twins in Practice: Launching the DIGITWIN4CIUE White Paper"
          url: https://luma.com/pouonhnz

