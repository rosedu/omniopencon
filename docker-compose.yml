services:
  hugo:
    container_name: omniopencon-site
    # "-full" images ship the extended Hugo build, needed for image processing.
    image: "peaceiris/hugo:v${HUGO_VERSION:-0.133.0}-full"
    ports:
      - 1313:1313
    volumes:
      - ${PWD}:/src
    command:
      - server
      - --bind=0.0.0.0
      - --noBuildLock
